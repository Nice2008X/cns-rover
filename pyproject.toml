[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cns-rover"
version = "0.2.0"
description = "Connectome-guided robot navigation simulator and MaleCNS workbench"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=16"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
test = ["httpx>=0.27,<1"]
brain = ["numpy>=1.26", "scipy>=1.12"]
malecns = ["numpy>=1.26", "scipy>=1.12", "pyarrow>=16"]

[project.scripts]
cns-rover = "cns_rover.__main__:main"

[tool.setuptools.package-data]
cns_rover = ["dashboard.html", "web/*", "web/assets/*"]

[tool.setuptools.packages.find]
include = ["cns_rover*"]
